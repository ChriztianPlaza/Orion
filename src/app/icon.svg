<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Browser-tab icon. A near-black rounded tile keeps the mark legible on a
    light tab strip, and the white constellation keeps it legible on a dark one,
    so it reads in both themes without a second asset.
  -->
  <rect width="32" height="32" rx="7.5" fill="#0A0A0A"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="none" stroke="#FFFFFF" stroke-opacity="0.16"/>
  <g stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.2" stroke-linecap="round">
    <path d="M9.4 8.2 12.9 20.3M23 9.9 20 16.4M12.9 20.3 9.7 26.2M20 16.4 23.7 25.1M9.4 8.2 23 9.9"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="9.4" cy="8.2" r="3.1"/>
    <circle cx="23" cy="9.9" r="2.1" fill-opacity="0.78"/>
    <circle cx="12.9" cy="20.3" r="1.7"/>
    <circle cx="16.4" cy="18.4" r="1.7"/>
    <circle cx="20" cy="16.4" r="1.7"/>
    <circle cx="9.7" cy="26.2" r="2" fill-opacity="0.78"/>
    <circle cx="23.7" cy="25.1" r="2.7"/>
  </g>
</svg>
